sri_lanka_bounds:
  lat_min: 5.9
  lat_max: 9.9
  lon_min: 79.5
  lon_max: 81.9
valid_outlet_sizes: ["Small", "Medium", "Large", "Extra Large"]
valid_outlet_types: ["Grocery", "Bakery", "Eatery", "Pharmacy", "Hotel", "SMMT", "Kiosk"]
outlet_type_corrections:
  "Grocry": "Grocery"
  "Bakry": "Bakery"

poi:
  n_clusters: 400
  buffer_deg: 0.018            # ~2km buffer added to each edge of the cluster bounding box
  overpass_url: "https://overpass-api.de/api/interpreter"
  timeout_s: 60                # seconds the Overpass server waits before giving up
  request_delay_s: 1.0         # polite delay between cluster queries (avoid rate limiting)
  radii_m: [500, 1000, 2000]   # radius bands for counting POIs per outlet (edit here to recompute Phase 2)

gravity_model:
  decay_epsilon: 0.05          # prevents division by zero (km)
  max_radius_km: 2.0           # POIs beyond this are excluded
  decay_function: "inverse_square"   # "inverse_square" | "exponential" | "inverse_linear"
  exponential_lambda: 1.5      # only used if decay_function = "exponential"
  weights:
    transport: 3.0
    school: 3.0
    hospitality: 2.0
    market: 2.0
    hospital: 1.0
    worship: 0.5

modelling:
  random_seed: 42
  cv_folds: 5
  target_percentile: 90
  algorithm: "catboost"                # Winner from Colab experiments (RMSE 40.38 vs LightGBM 40.96)
  catboost_params:
    iterations: 1289
    learning_rate: 0.0283
    depth: 5
    l2_leaf_reg: 1.495
    subsample: 0.713
    bootstrap_type: "Poisson"
    random_seed: 42
    verbose: 100
    task_type: "GPU"
    devices: "0"
    cat_features: ["Outlet_Type", "Outlet_Size", "province"]
  # --- LightGBM fallback (from initial config, pre-experiment) ---
  # lgbm_params:
  #   n_estimators: 1000
  #   learning_rate: 0.05
  #   num_leaves: 63
  #   min_child_samples: 20
  #   subsample: 0.8
  #   colsample_bytree: 0.8
  #   reg_alpha: 0.1
  #   reg_lambda: 0.1

team_name: "bigbug"
